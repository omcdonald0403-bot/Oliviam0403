<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Iowa State University Campanile scene</title>
  <desc id="desc">A blue sky, trees, green lawn, and a stone campus bell tower.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7cc7ff"/>
      <stop offset="100%" stop-color="#dfefff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5fb75d"/>
      <stop offset="100%" stop-color="#2a6b2a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d9c4a2"/>
      <stop offset="100%" stop-color="#b38d5d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#sky)"/>

  <g opacity="0.75" fill="#f5f5f5">
    <circle cx="920" cy="70" r="42"/>
    <circle cx="960" cy="60" r="38"/>
    <circle cx="995" cy="75" r="40"/>
    <circle cx="1030" cy="66" r="32"/>
    <circle cx="860" cy="92" r="30"/>
    <circle cx="890" cy="82" r="35"/>
  </g>

  <g fill="#2f4f28">
    <rect x="0" y="150" width="80" height="175"/>
    <rect x="70" y="118" width="60" height="210"/>
    <rect x="115" y="170" width="75" height="155"/>
    <rect x="990" y="150" width="70" height="180"/>
    <rect x="1045" y="120" width="90" height="205"/>
    <rect x="1110" y="160" width="90" height="165"/>
  </g>

  <g fill="#5b9c3b">
    <circle cx="25" cy="150" r="62"/>
    <circle cx="92" cy="140" r="54"/>
    <circle cx="170" cy="142" r="62"/>
    <circle cx="1020" cy="145" r="58"/>
    <circle cx="1095" cy="128" r="60"/>
    <circle cx="1180" cy="150" r="55"/>
  </g>

  <g>
    <rect x="0" y="330" width="1200" height="170" fill="url(#grass)"/>
    <g stroke="#7ca962" stroke-width="2" opacity="0.7">
      <path d="M0 342 L1200 342"/>
      <path d="M0 355 L1200 355"/>
      <path d="M0 368 L1200 368"/>
      <path d="M0 381 L1200 381"/>
      <path d="M0 394 L1200 394"/>
      <path d="M0 407 L1200 407"/>
      <path d="M0 420 L1200 420"/>
      <path d="M0 433 L1200 433"/>
    </g>
  </g>

  <g>
