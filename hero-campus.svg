    <rect x="530" y="80" width="140" height="35" fill="#b99463"/>
    <rect x="558" y="68" width="84" height="22" fill="#8a6a42"/>
    <rect x="574" y="52" width="52" height="18" fill="#7a5c38"/>
    <path d="M560 52 L640 52 L600 18 Z" fill="#7c5a38"/>
    <rect x="600" y="40" width="8" height="12" fill="#473521"/>
